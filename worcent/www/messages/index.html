{% extends "templates/web.html" %}

{% block title %}{{ _("Messages") }}{% endblock %}

{% block page_content %}
<div class="wc-section" style="max-width: 900px;">
	<h1>{{ _("Messages") }}</h1>
	<div style="display: flex; gap: 0; border: 1px solid var(--wc-border, #e5e7eb); border-radius: var(--wc-radius); overflow: hidden; min-height: 480px;">
		<div id="wc-inbox-list" style="width: 280px; flex: none; border-right: 1px solid var(--wc-border, #e5e7eb); overflow-y: auto;"></div>
		<div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
			<div id="wc-inbox-body" style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--gray-50, #f9fafb);">
				<div class="wc-chat-empty">{{ _("Select a conversation") }}</div>
			</div>
			<div id="wc-inbox-footer" style="display: none; gap: 8px; padding: 10px; border-top: 1px solid var(--wc-border, #e5e7eb);">
				<textarea id="wc-inbox-input" style="flex: 1; resize: none; height: 44px;" placeholder="{{ _('Type a message...') }}"></textarea>
				<button class="wc-btn wc-btn-primary wc-btn-sm" id="wc-inbox-send" type="button">{{ _("Send") }}</button>
			</div>
		</div>
	</div>
</div>

<script>
(function () {
	var active = null;
	var lastAt = null;
	var pollTimer = null;

	function call(method, args) {
		return frappe.call({ method: method, args: args || {} }).then(function (r) { return r.message; });
	}
	function escapeHtml(s) {
		var d = document.createElement("div");
		d.textContent = s || "";
		return d.innerHTML;
	}
	function renderList(conversations) {
		var list = document.getElementById("wc-inbox-list");
		if (!conversations.length) {
			list.innerHTML = '<div class="wc-chat-empty">{{ _("No conversations yet.") }}</div>';
			return;
		}
		list.innerHTML = conversations.map(function (c) {
			var badge = c.my_unread ? '<span class="wc-chat-item-badge">' + c.my_unread + "</span>" : "";
			return '<div class="wc-chat-list-item" data-c="' + c.name + '" data-name="' + escapeHtml(c.other_party_name || "") + '">' +
				'<span class="wc-chat-item-name">' + escapeHtml(c.other_party_name || "Conversation") + "</span>" + badge + "</div>";
		}).join("");
		Array.prototype.forEach.call(list.querySelectorAll(".wc-chat-list-item"), function (row) {
			row.addEventListener("click", function () {
				open(row.getAttribute("data-c"), row.getAttribute("data-name"));
			});
		});
	}
	function renderMessages(messages) {
		var body = document.getElementById("wc-inbox-body");
		if (!messages.length) {
			body.innerHTML = '<div class="wc-chat-empty">{{ _("Say hello") }} 👋</div>';
			return;
		}
		body.innerHTML = messages.map(function (m) {
			return '<div class="wc-chat-bubble ' + (m.is_mine ? "wc-chat-bubble-mine" : "wc-chat-bubble-theirs") + '">' + escapeHtml(m.body) + "</div>";
		}).join("");
		body.scrollTop = body.scrollHeight;
	}
	function poll() {
		if (!active) return;
		call("worcent.worcent_marketplace.conversation_api.get_messages", { conversation: active }).then(function (all) {
			renderMessages(all);
			if (all.length) lastAt = all[all.length - 1].sent_at;
		});
	}
	function open(name) {
		active = name;
		document.getElementById("wc-inbox-footer").style.display = "flex";
		call("worcent.worcent_marketplace.conversation_api.get_messages", { conversation: name }).then(function (messages) {
			renderMessages(messages);
			if (messages.length) lastAt = messages[messages.length - 1].sent_at;
		});
		call("worcent.worcent_marketplace.conversation_api.mark_read", { conversation: name }).then(loadList);
		if (pollTimer) clearInterval(pollTimer);
		pollTimer = setInterval(poll, 5000);
	}
	function loadList() {
		call("worcent.worcent_marketplace.conversation_api.list_my_conversations").then(renderList);
	}
	document.getElementById("wc-inbox-send").addEventListener("click", function () {
		var input = document.getElementById("wc-inbox-input");
		var body = (input.value || "").trim();
		if (!body || !active) return;
		input.value = "";
		call("worcent.worcent_marketplace.conversation_api.send_message", { conversation: active, body: body }).then(function () {
			return call("worcent.worcent_marketplace.conversation_api.get_messages", { conversation: active });
		}).then(renderMessages);
	});
	document.getElementById("wc-inbox-input").addEventListener("keydown", function (e) {
		if (e.key === "Enter" && !e.shiftKey) {
			e.preventDefault();
			document.getElementById("wc-inbox-send").click();
		}
	});

	loadList();
})();
</script>
{% endblock %}
